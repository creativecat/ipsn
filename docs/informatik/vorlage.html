<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Informatik – Präsentation</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1e2430; color: #e8ecf1; display: flex; height: 100vh; overflow: hidden; }
  /* Linke Navigation */
  nav { width: 260px; background: #151a24; border-right: 1px solid #2c3547; padding: 20px 0; overflow-y: auto; flex-shrink: 0; }
  nav h1 { font-size: 1rem; padding: 0 20px 16px; color: #7aa2f7; border-bottom: 1px solid #2c3547; margin-bottom: 10px; }
  nav a { display: block; padding: 9px 20px; color: #a9b1d6; text-decoration: none; font-size: .9rem; cursor: pointer; border-left: 3px solid transparent; }
  nav a:hover { background: #1e2735; color: #e8ecf1; }
  nav a.active { background: #232b3d; color: #fff; border-left-color: #7aa2f7; }
  /* Folienbereich */
  main { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
  .slide { display: none; max-width: 820px; padding: 40px; }
  .slide.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .slide h2 { font-size: 2rem; color: #7aa2f7; margin-bottom: 24px; }
  .slide ul, .slide p { font-size: 1.25rem; line-height: 1.7; }
  .slide ul { padding-left: 28px; }
  .slide code { background: #2c3547; padding: 2px 7px; border-radius: 4px; font-size: 1.05rem; }
  .slide pre { background: #11151d; border: 1px solid #2c3547; border-radius: 8px; padding: 18px; margin: 14px 0; overflow-x: auto; }
  .slide pre code { background: none; padding: 0; }
  /* Statusleiste */
  footer { position: fixed; bottom: 14px; right: 20px; font-size: .85rem; color: #565f89; }
  footer .keys { margin-right: 16px; }
  kbd { background: #2c3547; border-radius: 4px; padding: 1px 7px; font-family: inherit; }
</style>
</head>
<body>
<nav id="nav">
  <h1>Präsentationstitel</h1>
  <a data-slide="0">Startseite</a>
  <a data-slide="1">Thema 1</a>
  <a data-slide="2">Thema 2</a>
  <a data-slide="3">Zusammenfassung</a>
</nav>
<main>
  <section class="slide">
    <h2>Titelfolie</h2>
    <p>Untertitel / Thema der Präsentation</p>
  </section>
  <section class="slide">
    <h2>Thema 1</h2>
    <ul>
      <li>Punkt 1</li>
      <li>Punkt 2</li>
    </ul>
  </section>
  <section class="slide">
    <h2>Thema 2</h2>
    <p>Text und <code>Code</code> …</p>
    <pre><code>// Beispielcode
console.log("Hallo Informatik!");</code></pre>
  </section>
  <section class="slide">
    <h2>Zusammenfassung</h2>
    <ul><li>Das Wichtigste in Kürze</li></ul>
  </section>
</main>
<footer><span class="keys"><kbd>←</kbd> <kbd>→</kbd> navigieren</span><span id="counter"></span></footer>
<script>
  const slides = document.querySelectorAll('.slide');
  const links = document.querySelectorAll('#nav a');
  let idx = 0;
  function show(i) {
    idx = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach((s, n) => s.classList.toggle('active', n === idx));
    links.forEach((l, n) => l.classList.toggle('active', n === idx));
    document.getElementById('counter').textContent = (idx + 1) + ' / ' + slides.length;
  }
  links.forEach(l => l.addEventListener('click', () => show(+l.dataset.slide)));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') show(idx + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(idx - 1);
    if (e.key === 'Home') show(0);
    if (e.key === 'End') show(slides.length - 1);
  });
  show(0);
</script>
</body>
</html>
